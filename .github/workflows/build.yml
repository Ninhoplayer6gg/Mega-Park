name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools and platform
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f *.zip *.tpz

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Script check
        run: godot --headless --path . res://tests/script_check.tscn

      - name: Test runner
        run: godot --headless --path . res://tests/test_runner.tscn

      - name: Configure Android export (debug signing)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.3.tres

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/MegaPark.apk
          test -s build/android/MegaPark.apk
          cp build/android/MegaPark.apk MegaPark-Android.apk

      - name: Create source ZIP
        run: |
          zip -r Mega-Park-Source.zip project.godot export_presets.cfg assets data resources scenes scripts tests tools docs README.md CHANGELOG.md icon.png icon.png.import \
            -x "*/.git/*" "*/.godot/*" "*.apk" "*.DS_Store" "*/Thumbs.db" "*~" "*.tmp" "*/saves/*"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaPark-Android
          path: MegaPark-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mega-Park-Source
          path: Mega-Park-Source.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mega Park ${{ github.ref_name }}
          files: |
            MegaPark-Android.apk
            Mega-Park-Source.zip
